model:
  type: mamba
  d_model: 384
  d_state: 16
  d_conv: 4
  expand: 2
  d_ff: 1536
  n_layers: 6
  dropout: 0.1
  max_seq_len: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.0005
  weight_decay: 0.01
  epochs: 4
  optimizer: adamw
  scheduler: cosine
  warmup_steps: 1000
  gradient_clip: 1.0
  max_steps_per_epoch: 5000
  num_workers: 0

data:
  train_cipher: data/part1/train/cipher.jsonl
  train_clean: data/part1/train/cleaned.jsonl
  val_cipher: data/part1/validation/cipher.jsonl
  val_clean: data/part1/validation/cleaned.jsonl
  test_cipher: data/part1/test/cipher.jsonl
  test_clean: data/part1/test/cleaned.jsonl
  heldout_cipher: data/part1/heldout/cipher.jsonl
  max_len: 128

wandb:
  project: Anlp_A3
  run_name: mamba_large

huggingface:
  repo_id: nani-nav/anlp-a3-mamba-large
